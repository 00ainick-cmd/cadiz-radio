<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadiz Radio</title>
<link rel="stylesheet" href="../station.css">
</head>
<body class="copy">
<header class="top">
  <a class="wordmark" href="../">CADIZ RADIO</a>
  <a class="back" href="../">All papers</a>
</header>
<div class="desk">
  <aside class="radio-col">
    <div class="set">
      <img class="cabinet" src="../plate/player-face.png" alt="The Cadiz Sentinel">
      <div class="deck">
        <p class="now-kind" id="now-kind">Story</p>
        <p class="now-title" id="now-title">The Cadiz Sentinel</p>
        <canvas id="wave"></canvas>
        <div class="knobs">
          <button id="prev" type="button">Prev</button>
          <button id="play" type="button">Play</button>
          <button id="next" type="button">Next</button>
        </div>
      </div>
    </div>
    <section class="transcript">
      <h2>Read along</h2>
      <p id="script">Press Play.</p>
    </section>
  </aside>
  <article class="paper">
    <img class="mast" src="../plate/masthead.jpg" alt="The Cadiz Sentinel">
    <p class="dateline" id="dateline"></p>
    <p class="ed" id="ed"></p>
    <aside class="hist" id="hist"></aside>
    <div id="pages"></div>
    <p class="ed" style="margin-top:28px">Source: <a id="src" href="#">Chronicling America</a></p>
  </article>
</div>
<audio id="audio" preload="metadata"></audio>
<script src="../player.js"></script>
</body>
</html>
